# CI: enforce the project's real correctness gate (`npx tsc --noEmit` — esbuild
# bundles without type-checking) plus the bundle and VSIX packaging. The build is
# platform-neutral, so a single ubuntu-latest job is enough.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (the real correctness gate)
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Package VSIX
        run: npx vsce package

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: '*.vsix'
