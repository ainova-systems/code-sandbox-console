# CI: enforce the project's single verification command (`npm run verify` =
# strict typecheck + esbuild bundle — the same gate developers run locally)
# plus VSIX packaging. The build is platform-neutral, so a single
# ubuntu-latest job is enough.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify (typecheck + build)
        run: npm run verify

      - name: Package VSIX
        run: npx vsce package

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v6
        with:
          name: vsix
          path: '*.vsix'
