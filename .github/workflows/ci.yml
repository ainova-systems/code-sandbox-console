# CI: enforce the project's single verification command (`npm run verify` =
# strict typecheck + esbuild bundle — the same gate developers run locally)
# plus the packaging checks a release depends on. The build is platform-neutral,
# so a single ubuntu-latest job is enough.
#
# No Node matrix: `verify` is `tsc --noEmit` plus an esbuild bundle, and neither
# exercises runtime behaviour — repeating them on a second Node version would
# re-run the same typecheck, not test anything new. The extension runs on the
# Node that VS Code embeds, which is not CI's anyway. Add a matrix when there is
# a test suite whose result could actually differ per version.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Verify and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify (typecheck + build)
        run: npm run verify

      # `vsce ls` does not run vscode:prepublish, so `dist/extension.js` has to
      # exist before the check — `verify` bundles it, so no separate build step
      # is needed. Should `verify` ever stop bundling, this fails with the
      # script's own "run npm run build first" message rather than silently.
      #
      # vsce ignores .gitignore once a .vscodeignore exists, so this is the only
      # thing standing between a new directory and every user's machine.
      - name: Check VSIX contents
        run: node scripts/check-package-contents.mjs

      # Named `-ci` so a downloaded artifact can never be mistaken for the
      # release build, which the Release workflow names with its version.
      - name: Package VSIX
        run: npx vsce package --out sandbox-console-ci.vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: '*.vsix'
