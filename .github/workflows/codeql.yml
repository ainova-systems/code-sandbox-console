# CodeQL: static analysis of the TypeScript sources. The extension builds `sbx`
# CLI invocations from workspace configuration and handles agent credentials, so
# command-injection and path-handling defects are the class of bug worth catching
# automatically — the same modules the project profile marks high-risk.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript
