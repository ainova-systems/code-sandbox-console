version: 1
name: code-sandbox-console
sandboxes:
  claude:
    agent: claude
    title: claude-clone
    group: isolated
    mount: clone
  # FR-060 lifecycle hooks — this repo's own demo, and the fixture the ext-run-local skill
  # walks. Everything lands in ONE file inside the sandbox: /tmp/hooks.log
  #
  #   cat /tmp/hooks.log          (or: tail -f /tmp/hooks.log)
  #
  # TEST "edit, restart, applied": change the single line marked EDIT ME from v1 to v2,
  # save, then Stop → Connect. A new "===== start v2 =====" block appears, with a new
  # service pid. Nothing else to press — a hook change never needs a Rebuild.
  # (`setup` is the exception: it runs once while the sandbox is created.)
  #
  # Deliberately one command per line, no YAML block scalars: the generated CLI's recipe
  # reader (.sandbox/scripts/sbx.sh, FR-052) handles plain and quoted scalars only, and this
  # demo must produce the same sandbox from VS Code and from a shell. Writing to /tmp keeps
  # both this repository and the sandbox's private clone clean.
  hooks-demo:
    agent: shell
    title: hooks demo
    group: demo
    mount: clone
    setup:
      - printf '%s  setup    once, at create — workspace_exists=%s source_readable=%s\n' "$(date -u +%T)" "$(test -d "$SANDBOX_WORKSPACE" && echo yes || echo no)" "$(test -d "$SANDBOX_SOURCE/.git" && echo yes || echo no)" >> /tmp/hooks.log
    startup:
      - printf '\n%s  ===== start v1 =====\n' "$(date -u +%T)" >> /tmp/hooks.log   # <<< EDIT ME: v1 → v2
      - printf '%s  startup  head=%s clone_head=%s\n' "$(date -u +%T)" "$(git -C "$SANDBOX_SOURCE" rev-parse --short HEAD)" "$(git -C "$SANDBOX_WORKSPACE" rev-parse --short HEAD)" >> /tmp/hooks.log
      - cp "$SANDBOX_SOURCE/README.md" /tmp/README.from-source.md && printf '%s  startup  copied README.md out of the read-only host tree\n' "$(date -u +%T)" >> /tmp/hooks.log
      - printf '%s  startup  git-ignored host file dist/extension.js — on the host=%s, in the clone=%s\n' "$(date -u +%T)" "$(test -f "$SANDBOX_SOURCE/dist/extension.js" && echo yes || echo no)" "$(test -f "$SANDBOX_WORKSPACE/dist/extension.js" && echo yes || echo no)" >> /tmp/hooks.log
    services:
      - while true; do printf '%s  service  alive pid=%s\n' "$(date -u +%T)" "$$" >> /tmp/hooks.log; sleep 10; done
